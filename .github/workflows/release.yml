name: Release

# Push a tag like v0.1.0 and this builds installers for all three OSes
# and attaches them to the GitHub release for that tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PUBLIC_RELEASE_TOKEN: ${{ secrets.HEARTH_PUBLIC_RELEASE_TOKEN }}

jobs:
  build:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds by design (see docs/INSTALL_CLIENT.md); don't let
      # electron-builder go hunting for signing identities on macOS.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Bundle the auto-update token (repo secret, read-only)
        shell: bash
        run: |
          mkdir -p build
          printf '%s' "${{ secrets.HEARTH_UPDATE_TOKEN }}" > build/update-token.txt
      - run: npm run dist -- --publish never
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            client/release/*.AppImage
            client/release/*.deb
            client/release/*.exe
            client/release/*.dmg
            install/client/install-linux.sh
      - name: Mirror installers to the public downloads repo
        if: env.PUBLIC_RELEASE_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: silkhelp-wq/hearth-releases
          token: ${{ secrets.HEARTH_PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body: >
            Hearth ${{ github.ref_name }} — installers for Windows (.exe),
            macOS (.dmg), and Linux (.AppImage / .deb). Pick the file for
            your system; install help lives in this repo's README.
          files: |
            client/release/*.AppImage
            client/release/*.deb
            client/release/*.exe
            client/release/*.dmg
            install/client/install-linux.sh
