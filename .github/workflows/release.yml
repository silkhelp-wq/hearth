name: Release

# Push a tag like v0.1.0 and this builds installers for all three OSes
# and attaches them to the GitHub release for that tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PUBLIC_RELEASE_TOKEN: ${{ secrets.HEARTH_PUBLIC_RELEASE_TOKEN }}

jobs:
  build:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds by design (see docs/INSTALL_CLIENT.md); don't let
      # electron-builder go hunting for signing identities on macOS.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Bundle the auto-update token (repo secret, read-only)
        shell: bash
        run: |
          mkdir -p build
          printf '%s' "${{ secrets.HEARTH_UPDATE_TOKEN }}" > build/update-token.txt
      - run: npm run dist -- --publish never
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            client/release/*.AppImage
            client/release/*.deb
            client/release/*.exe
            client/release/*.dmg
      - name: Attach the Linux installer script (ubuntu only)
        # One runner only: all three uploading the same asset name races —
        # one deletes the asset another is mid-replace on → 404 Not Found.
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: install/client/install-linux.sh
      - name: Mirror installers to the public downloads repo
        if: env.PUBLIC_RELEASE_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: silkhelp-wq/hearth-releases
          token: ${{ secrets.HEARTH_PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 1️⃣ Before you download
            - Get the **server address** from your host.
            - Address starts with `http://100.`? Install **[Tailscale](https://tailscale.com/download)**, accept your host's invite, and make sure it shows **Connected** — Hearth can't reach the server without it.

            ## 2️⃣ Pick your file
            | Your computer | Download |
            |---|---|
            | 🪟 Windows 10/11 | `Hearth.Setup.<version>.exe` |
            | 🍎 Mac — Apple Silicon | `Hearth-<version>-arm64.dmg` |
            | 🍎 Mac — Intel | `Hearth-<version>.dmg` |
            | 🐧 Linux (any distro) | `Hearth-<version>.AppImage` — or run `install-linux.sh` for a menu entry + cleanup |
            | 🐧 Ubuntu / Debian | `hearth_<version>_amd64.deb` |
            | 🖥️ **Hosting the server?** | `hearth-server-<version>.tar.gz` — beginner guide inside |

            ## 3️⃣ Before you install
            The builds are unsigned (a private hobby app), so your OS warns once:
            - **Windows:** SmartScreen → **More info → Run anyway**. The installer then shows setup notes.
            - **Mac:** first open is **right-click the app → Open → Open**. A READ ME FIRST inside the dmg walks you through it.
            - **Linux:** make the AppImage executable (right-click → Properties → allow executing), or just use `install-linux.sh`.

            Full beginner guide: this repo's README.
          files: |
            client/release/*.AppImage
            client/release/*.deb
            client/release/*.exe
            client/release/*.dmg
      - name: Mirror the Linux installer script (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && env.PUBLIC_RELEASE_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: silkhelp-wq/hearth-releases
          token: ${{ secrets.HEARTH_PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: install/client/install-linux.sh
